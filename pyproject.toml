[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoint-bench"
version = "0.1.0"
description = "Provider-neutral operational benchmarking for public LLM inference endpoints"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Stewart Tong" }]
keywords = ["llm", "inference", "benchmarking", "performance", "aiperf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0.1,<10", "ruff>=0.14.3,<0.15"]

[project.scripts]
endpoint-bench = "endpoint_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
