name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.14
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.14
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Confirm engine tests skip cleanly without the pinned engine
        run: |
          uv run pytest tests/test_aiperf_integration.py tests/test_process_lifecycle.py -q \
            | tee /tmp/skip-check.txt
          grep -Eq '[0-9]+ skipped' /tmp/skip-check.txt

  offline-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.14
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Validate example registry
        run: uv run endpoint-bench registry validate
      - name: Validate offline dry-run
        run: |
          uv run endpoint-bench run \
            --target offline-mock-smoke \
            --profile smoke \
            --dry-run > /tmp/endpoint-bench-dry-run.json
          uv run python -c 'import json; m=json.load(open("/tmp/endpoint-bench-dry-run.json")); assert m["inference"]["network_requests"] == 0'
      - name: Start local mock provider
        run: |
          uv run endpoint-bench mock --port 18080 > /tmp/mock.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:18080/v1/models > /dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "mock provider did not become ready"
          cat /tmp/mock.log
          exit 1
      - name: Run streaming conformance probe against the mock
        run: |
          uv run endpoint-bench probe \
            --config examples/local-benchmark/registry.json \
            --target local-mock-agent-replay \
            --profile smoke --requests 2 \
            --run-dir /tmp/probe-stream > /tmp/probe-stream.json
          uv run python -c 'import json; m=json.load(open("/tmp/probe-stream.json")); c=m["counters"]; assert c["successful_trials"] == 2, c; assert c["http_attempts"] == 2, c'
      - name: Run multi-turn tool-call probe against the mock
        run: |
          uv run endpoint-bench probe \
            --config examples/local-benchmark/registry.json \
            --target local-mock-agent-replay \
            --profile smoke --scenario tool-round-trip --requests 1 \
            --run-dir /tmp/probe-tool > /tmp/probe-tool.json
          uv run python -c 'import json; m=json.load(open("/tmp/probe-tool.json")); c=m["counters"]; assert c["successful_trials"] == 1, c; assert c["http_attempts"] == 2, c; assert m["scenario"] == "tool-round-trip"'
      - name: Validate the committed agent-shaped trace
        run: |
          uv run python -c '
          import json, pathlib
          rows = [json.loads(line) for line in pathlib.Path("examples/local-benchmark/agent-trace.jsonl").read_text().splitlines() if line.strip()]
          assert len(rows) == 12, len(rows)
          assert all("session_id" in row and "input_length" in row for row in rows)
          assert len({row["session_id"] for row in rows}) == 4
          '

  engine-integration:
    # Opt-in: installs the pinned AIPerf engine (~96 distributions) and runs the
    # integration tests that are skipped in the default offline suite.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.14
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install pinned AIPerf engine
        run: |
          uv venv .venv-aiperf --python 3.13
          VIRTUAL_ENV=.venv-aiperf uv pip install aiperf==0.13.0
          test "$(.venv-aiperf/bin/aiperf --version)" = "0.13.0"
      - name: Run engine integration tests
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: uv run pytest tests/test_aiperf_integration.py tests/test_process_lifecycle.py -q
